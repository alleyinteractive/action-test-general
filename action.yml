name: 'Run General filesystem tests'
description: 'Run basic filesystem checks'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  check-gitignore:
    description: 'Checks the code for files that should be ignored via .gitignore'
    required: false
    default: true
  check-git-conflict:
    description: 'Checks the code for git conflicts'
    required: false
    default: true

runs:
  using: 'composite'
  steps:
      - name: Check for gitignored files
        if: inputs.check-gitignore
        shell: bash
        run: |
          if [[ ! -z $(git ls-files -ci --exclude-standard) ]]; then
            echo "Gitignored files found."
            exit 1
          fi

      - name: Check for git conflicts
        if: inputs.check-git-conflict
        shell: bash
        run: |
          if [[ ! -z $(git grep -E "<<<<<<< |>>>>>>> " -- './*' ':!buddy.yml' ':!.buddy/*') ]]; then
            echo "Git conflict found."
            exit 1
          fi
